publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # STORAGE (Hybrid)
  sqflite: ^2.3.0
  shared_preferences: ^2.2.2
  
  # UI & TOOLS
  path: ^1.9.0
  fl_chart: ^0.66.0
  intl: ^0.19.0
  url_launcher: ^6.2.5
  google_fonts: ^6.2.1
  
  # AI CONNECTIONS (New!)
  http: ^1.2.1
  flutter_markdown: ^0.6.22

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true